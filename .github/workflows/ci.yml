name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectar:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: d
        run: |
          [ -f backend/app/__init__.py ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repositório em conta PESSOAL (winerghost, type=User): a licença não é exigida e o
          # secret pode ficar vazio. Se o repo migrar para uma ORGANIZAÇÃO, criar o secret
          # GITLEAKS_LICENSE (licença gratuita em gitleaks.io) ou o job passa a falhar.
          # A action está fixada por SHA de commit.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Decide se os jobs de Supabase local (banco, contrato) precisam rodar.
  # Gatilho: supabase/**, repositorios do backend, testes de contrato/conftest, requirements e este workflow.
  detectar-banco:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'push' || github.base_ref == 'main'
    outputs:
      rodar: ${{ steps.mudou.outputs.rodar }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detectar mudancas relevantes
        id: mudou
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ANTES_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base="$BASE_SHA"
          [ "$EVENTO" = "push" ] && base="$ANTES_SHA"
          git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Base indisponivel; rodando por seguranca."
            echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(supabase/|backend/app/(repositorios/|services|errors)|scripts/seed-admin\.sh$|backend/tests/(.*contrato.*|guarda_banco|test_guarda_banco|test_integracao_|conftest\.py$)|backend/requirements.*\.txt$|\.github/workflows/ci\.yml$)'; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem mudancas relevantes ao banco/contrato; pulando."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          fi

  # Testes de banco (RLS, grants, SECURITY DEFINER, km, checklist, concorrencia) contra
  # um Supabase LOCAL efemero. Nunca usa secrets nem conecta a projeto remoto.
  banco:
    needs: detectar-banco
    if: needs.detectar-banco.outputs.rodar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Dependencias dos testes (venv, versoes fixadas)
        run: |
          python -m venv "$RUNNER_TEMP/venv-banco"
          "$RUNNER_TEMP/venv-banco/bin/pip" install --require-virtualenv -r supabase/tests/requirements.txt
      # Apenas o necessario: db (Postgres), gotrue (cria o schema auth/auth.users) e
      # storage-api (cria storage.buckets/objects). O resto fica de fora.
      # start ja aplica TODAS as migrations em ordem; db reset garante banco limpo e
      # reaplica tudo (mesmo caminho que o dev local usa).
      - name: Subir Supabase local e aplicar migrations
        run: |
          supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
      # O db reset recria o banco e apaga o marcador: criar DEPOIS do reset e ANTES do pytest.
      - name: Marcar banco como descartavel
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -c "comment on database postgres is 'sisveiculos:descartavel'"
      # N-04: o expurgo de localizacoes depende do agendamento pg_cron; sem a linha em
      # cron.job a retencao (LGPD) deixaria de rodar em silencio.
      - name: Verificar agendamento do expurgo de localizacoes (pg_cron)
        env:
          # Credenciais padrao FIXAS e publicas do Supabase local (nao e segredo).
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          n="$(psql "$TEST_DATABASE_URL" -tA -c "select count(*) from cron.job where jobname = 'expurgar-localizacoes'")"
          if [ "$n" != "1" ]; then
            echo "::error::Falta o job pg_cron 'expurgar-localizacoes' em cron.job (encontrado: ${n:-0}). Confira a migration 20261116120100_agenda_expurgo_localizacoes.sql e a extensao pg_cron."
            exit 1
          fi
          echo "Job expurgar-localizacoes presente em cron.job."
      - name: Testes de banco
        env:
          # Credenciais padrao FIXAS e publicas do Supabase local (nao e segredo).
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          TEST_DATABASE_CONFIRM: descartavel
        run: >
          "$RUNNER_TEMP/venv-banco/bin/python" -m pytest supabase/tests
          -c supabase/tests/pytest.ini --rootdir supabase/tests
          -m db_local -p no:xdist -p no:cacheprovider -ra
      - name: Parar containers
        if: always()
        run: supabase stop --no-backup || true

  # Teste de contrato: rota Flask + SupabaseRepositorio contra Postgres/PostgREST/gotrue
  # reais do Supabase LOCAL efemero. Nunca usa secrets nem projeto remoto.
  contrato:
    needs: detectar-banco
    if: needs.detectar-banco.outputs.rodar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependencias do backend
        run: pip install -r backend/requirements-dev.txt
      # Diferente do job banco, aqui precisa da API HTTP: mantem kong (gateway) e postgrest
      # alem de db, gotrue e storage-api.
      - name: Subir Supabase local e aplicar migrations
        run: |
          supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
      # O db reset apaga o marcador: criar DEPOIS do reset e ANTES do pytest.
      - name: Marcar banco como descartavel
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -c "comment on database postgres is 'sisveiculos:descartavel'"
      # Chaves do Supabase local sao efemeras; ficam em arquivo 600 (nao em GITHUB_ENV) e so os
      # passos que as usam as carregam.
      - name: Obter URL e service_role do Supabase local
        run: |
          set -eu
          umask 077
          trap 'rm -f "$RUNNER_TEMP/supabase.env"' EXIT
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          url="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")"
          key="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")"
          [ -n "$url" ] && [ -n "$key" ] || { echo "API_URL/SERVICE_ROLE_KEY ausentes em supabase status"; exit 1; }
          echo "::add-mask::$key"
          printf 'CONTRATO_SUPABASE_URL=%s\nCONTRATO_SERVICE_ROLE_KEY=%s\nCONTRATO_CONFIRM=descartavel\n' "$url" "$key" > "$RUNNER_TEMP/contrato.env"
      # Os testes precisam de ao menos 1 admin ativo (nao se cria admin pela API): conta no Auth
      # local (efemero, senha aleatoria descartada) e seed pelo script oficial do projeto.
      - name: Semear admin no banco local
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SEED_ADMIN_EMAIL: admin-contrato@teste.example.com
        run: |
          set -eu
          set -a; . "$RUNNER_TEMP/contrato.env"; set +a
          senha="$(openssl rand -hex 24)"
          echo "::add-mask::$senha"
          curl -fsS -o /dev/null -X POST "$CONTRATO_SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $CONTRATO_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $CONTRATO_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$SEED_ADMIN_EMAIL\",\"password\":\"$senha\",\"email_confirm\":true}"
          sh scripts/seed-admin.sh
      - name: Testes de contrato
        working-directory: backend
        run: |
          set -eu
          set -a; . "$RUNNER_TEMP/contrato.env"; set +a
          python -m pytest -m contrato -p no:cacheprovider
      - name: Parar containers
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/contrato.env"
          supabase stop --no-backup || true

  backend:
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # O lock com hashes é o que vai para a imagem: garantir que instala e que não tem CVE.
      - name: Lock com hashes instala (--require-hashes) em venv limpo
        run: |
          python -m venv "$RUNNER_TEMP/venv-lock"
          "$RUNNER_TEMP/venv-lock/bin/pip" install --require-hashes -r requirements.lock.txt
      - run: ruff check .
      # Regras S (bandit); asserts e senhas fictícias em testes são aceitos.
      - run: >
          ruff check --select S
          --extend-per-file-ignores "tests/*:S101"
          --extend-per-file-ignores "tests/*:S105"
          --extend-per-file-ignores "tests/*:S106"
          .
      - run: black --check .
      - run: pytest
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock.txt

  frontend:
    needs: detectar
    if: needs.detectar.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Só dependências de produção (as de dev não vão para o export estático).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      # Versão do Playwright (e do Chromium que ela baixa) vem do package-lock.json via npm ci;
      # usa o binário local, nunca `npx` (que poderia baixar outra versão).
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e

  trivy:
    needs: detectar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy fs (dependências, IaC, segredos)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Build imagem backend
        if: needs.detectar.outputs.backend == 'true'
        run: docker build -t sisveiculos-backend:ci backend
      - name: Trivy imagem backend
        if: needs.detectar.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: sisveiculos-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Build imagem frontend
        if: needs.detectar.outputs.frontend == 'true'
        run: >
          docker build -t sisveiculos-frontend:ci
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
          --build-arg NEXT_PUBLIC_SITE_URL=https://exemplo.invalid
          frontend
      - name: Trivy imagem frontend
        if: needs.detectar.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: sisveiculos-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Guarda de invariantes de configuracao (sem dependencias): gunicorn com 1 worker enquanto
  # o rate limit usar memory:// (ver scripts/verificar-workers.sh).
  invariantes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verificar workers do gunicorn
        run: sh scripts/verificar-workers.sh
