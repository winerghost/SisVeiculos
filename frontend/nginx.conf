# Instalado em /etc/nginx/conf.d/default.conf (imagem nginx-unprivileged; pid e temp em /tmp).

# IP real do cliente. Confia no cabeçalho CF-Connecting-IP apenas quando o par imediato é:
# (a) faixa oficial do Cloudflare ou (b) o proxy local (CloudPanel via bridge do Docker).
# Qualquer outro par tem o cabeçalho ignorado. Atualizar as faixas conforme
# https://www.cloudflare.com/ips-v4 e /ips-v6 (mudou nginx.conf: exige --build).
# Ver docs/deploy-ip-real.md (firewall da VPS restrito ao Cloudflare).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Proxy local (CloudPanel) chega ao container pelo gateway da rede do compose, cuja
# sub-rede é fixa em docker-compose.yml (networks.default.ipam). Manter os dois iguais.
set_real_ip_from 172.29.88.0/24;
real_ip_header CF-Connecting-IP;

# Log de acesso sem query string: $uri (não $request), pois o token do convite trafega em
# /convite?convite=<token>. $remote_addr já é o IP real (real_ip acima). Sem referer/UA.
log_format sem_query '$remote_addr [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    access_log /dev/stdout sem_query;
    # Nível crit: em 502/504 os níveis error e inferiores gravam a linha "request:" com a query
    # (ex.: /api/admin/usuarios?q=<nome ou e-mail>, dado pessoal). Falhas de inicialização
    # (emerg/alert/crit) continuam registradas.
    error_log /dev/stderr crit;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Cabeçalhos também em nível de server: cobrem respostas geradas pelo nginx (404/413/502).
    include /etc/nginx/snippets/security-headers.conf;

    # API: encaminha ao gunicorn (serviço interno "backend").
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # Evita cabeçalho duplicado: o nginx é a fonte única destes (o Flask também os envia).
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Após o real_ip, $remote_addr é o IP do cliente validado; o valor enviado pelo
        # cliente é sobrescrito, nunca repassado.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 35s;
    }

    # Service worker e manifest: sempre revalidados.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Assets com hash do Next: cache longo.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Páginas do export estático. Sem fallback SPA: rota inexistente devolve 404 com /404.html.
    # Barra final é removida por redirecionamento (ex.: /login/ -> /login).
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~ ^/(.+)/$ {
        absolute_redirect off;
        return 301 /$1;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }
}
