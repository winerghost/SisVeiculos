# Nome fixo do projeto: sem ele o Compose usa o nome da pasta do clone, e outro sistema da VPS com
# o mesmo nome compartilharia rede e containers (conflito).
name: sisveiculos

services:
  backend:
    build:
      context: ./backend
    # Lista explícita (sem env_file): o container só recebe o que usa.
    # Variáveis do pipeline (SUPABASE_ACCESS_TOKEN etc.) nunca chegam aqui.
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-}
      URL_ACEITE_CONVITE: ${URL_ACEITE_CONVITE:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      N8N_HMAC_SECRET: ${N8N_HMAC_SECRET:-}
      N8N_ALLOWED_HOSTS: ${N8N_ALLOWED_HOSTS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      EMAIL_DOMINIOS_RELATORIO: ${EMAIL_DOMINIOS_RELATORIO:-}
      # Relatórios por e-mail (SMTP). Desligado sem EMAIL_ENABLED=true. EMAIL_PASSWORD é segredo.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_SECURITY: ${EMAIL_SECURITY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-}
      EMAIL_MAX_PER_HOUR: ${EMAIL_MAX_PER_HOUR:-}
      EMAIL_MAX_PER_USER_HOUR: ${EMAIL_MAX_PER_USER_HOUR:-}
      EMAIL_NOTIF_INTERVALO_SEGUNDOS: ${EMAIL_NOTIF_INTERVALO_SEGUNDOS:-}
      EMAIL_NOTIF_MAX_POR_HORA: ${EMAIL_NOTIF_MAX_POR_HORA:-}
      # IA opcional (desligada sem AI_ENABLED=true). Chaves são segredos só do backend.
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODELOS_OPENAI: ${AI_MODELOS_OPENAI:-}
      AI_MODELOS_ANTHROPIC: ${AI_MODELOS_ANTHROPIC:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-}
      AI_RATE_LIMIT_PER_USER: ${AI_RATE_LIMIT_PER_USER:-}
      AI_RATE_LIMIT_PER_UNIT: ${AI_RATE_LIMIT_PER_UNIT:-}
      AI_MONTHLY_TOKEN_CAP: ${AI_MONTHLY_TOKEN_CAP:-}
      AI_CIRCUIT_FAILURE_THRESHOLD: ${AI_CIRCUIT_FAILURE_THRESHOLD:-}
      AI_CIRCUIT_OPEN_SECONDS: ${AI_CIRCUIT_OPEN_SECONDS:-}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/saude', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      backend:
        condition: service_healthy
    # Só loopback. Porta do HOST configurável (FRONTEND_PORT no .env) para não colidir com outros
    # sistemas da VPS; dentro do container o nginx continua em 8080. O proxy reverso do CloudPanel
    # aponta para http://127.0.0.1:<FRONTEND_PORT> (o frontend, nunca o backend).
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# Sub-rede fixa: o nginx do frontend só confia em CF-Connecting-IP vindo desta faixa
# (set_real_ip_from em frontend/nginx.conf; precisa ser a MESMA nos dois arquivos). Ver
# docs/deploy-ip-real.md. Faixa 10.x de propósito: o Docker distribui redes 172.16-31.x e
# 192.168.x automaticamente aos outros projetos da VPS, então uma faixa 172.x fixa tem alto risco
# de "Pool overlaps". Se 10.213.88.0/24 já existir na VPS, ver docs/deploy-vps.md (troubleshooting).
networks:
  default:
    ipam:
      config:
        - subnet: 10.213.88.0/24
