# Incluído em nível de server (erros gerados pelo nginx: 404/413/502) e em cada location
# (add_header não herda quando o location define o seu).
# geolocation=(self): o motorista envia a posição ao registrar saída/chegada (recurso opcional).
# HSTS fica no Cloudflare. 'unsafe-inline' em script/style é exigido pelo export estático
# do Next.js (scripts inline de hidratação); trocar por hashes é um endurecimento futuro.
# __SUPABASE_ORIGIN__ é substituído no build (Dockerfile) a partir de NEXT_PUBLIC_SUPABASE_URL.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __SUPABASE_ORIGIN__; font-src 'self' data:; connect-src 'self' __SUPABASE_ORIGIN__; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Sistema interno: fora de buscadores. Não impede pré-visualização (WhatsApp/Teams/Telegram).
# Não criar robots.txt com Disallow: o Twitterbot o respeita (sem card) e o noindex não seria lido.
add_header X-Robots-Tag "noindex, nofollow" always;
